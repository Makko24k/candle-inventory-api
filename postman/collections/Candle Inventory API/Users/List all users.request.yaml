$kind: http-request
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is a list', function () { pm.expect(pm.response.json()).to.be.an('array'); });
      pm.test('Passwords are never returned', function () {
        pm.response.json().forEach(function (u) {
          pm.expect(u).to.not.have.property('password');
          pm.expect(u).to.not.have.property('Password');
        });
      });
    language: text/javascript
order: 4000
