$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Demo Staff",
      "username": "{{newUsername}}",
      "password": "{{staffPassword}}",
      "role": "Staff"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('newUsername', 'teststaff' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
