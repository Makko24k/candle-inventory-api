$kind: http-request
url: "{{baseUrl}}/products/{{newProductId}}/materials"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "materialId": 1,
      "quantityNeeded": 100
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 9000
