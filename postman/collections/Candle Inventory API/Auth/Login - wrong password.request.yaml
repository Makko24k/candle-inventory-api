$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{adminUsername}}",
      "password": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () { pm.response.to.have.status(401); });
      pm.test('Uses the standard error format', function () {
        var body = pm.response.json();
        pm.expect(body.success).to.eql(false);
        pm.expect(body.statusCode).to.eql(401);
        pm.expect(body.errors).to.be.an('array');
      });
    language: text/javascript
order: 3000
