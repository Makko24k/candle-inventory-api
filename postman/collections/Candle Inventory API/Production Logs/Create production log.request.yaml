$kind: http-request
url: "{{baseUrl}}/production-logs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 1,
      "quantityProduced": 1,
      "dateProduced": "{{today}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
