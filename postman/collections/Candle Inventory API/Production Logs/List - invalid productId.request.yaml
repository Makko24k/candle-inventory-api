$kind: http-request
url: "{{baseUrl}}/production-logs?productId=abc"
method: GET
queryParams:
  productId: abc
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () { pm.response.to.have.status(400); });
      pm.test('Uses the standard error format', function () {
        var body = pm.response.json();
        pm.expect(body.success).to.eql(false);
        pm.expect(body.statusCode).to.eql(400);
        pm.expect(body.errors).to.be.an('array');
      });
    language: text/javascript
order: 9000
