$kind: http-request
url: "{{baseUrl}}/raw-materials/1"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403', function () { pm.response.to.have.status(403); });
      pm.test('Uses the standard error format', function () {
        var body = pm.response.json();
        pm.expect(body.success).to.eql(false);
        pm.expect(body.statusCode).to.eql(403);
        pm.expect(body.errors).to.be.an('array');
      });
    language: text/javascript
order: 16000
