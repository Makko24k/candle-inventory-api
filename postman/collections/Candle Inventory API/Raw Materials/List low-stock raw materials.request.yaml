$kind: http-request
url: "{{baseUrl}}/raw-materials?lowStock=true"
method: GET
queryParams:
  lowStock: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is a list', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 2000
